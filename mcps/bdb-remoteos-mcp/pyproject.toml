[project]
name = "bdb-remoteos-mcp"
version = "0.1.0"
description = "BDB RemoteOS Multi-Cloud Execution Gateway FastMCP Server with 4-Eyes Approval Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "fastmcp>=0.1.0",
    "mcp>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
bdb-remoteos-mcp = "bdb_remoteos_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bdb_remoteos_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
