[package]
name = "aos-tray"
version = "0.1.0"
description = "AOS desktop companion: tray / menu bar app that drives the AOS CLIs"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "aos_tray_lib"
crate-type = ["rlib"]

[[bin]]
name = "aos-tray"
path = "src/main.rs"
required-features = ["app"]

[features]
default = ["app"]
# The tray and window glue. Without it only the pure, unit-tested modules build.
app = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
