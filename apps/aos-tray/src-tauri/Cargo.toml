[package]
name = "aos-tray"
version = "0.1.0"
description = "AOS desktop companion: tray / menu bar app that drives the AOS CLIs"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "aos_tray_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
