<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AOS Store</title>
<link rel="stylesheet" href="aos-tokens.css">
<style>
:root{--paper:var(--aos-bg);--paper-2:var(--aos-surface-2);--ink:var(--aos-text);--muted:var(--aos-muted);--line:var(--aos-border);--green:var(--aos-accent);--green-deep:var(--aos-accent);--white:var(--aos-surface);--bad:var(--aos-bad);--sans:var(--aos-font-ui);--serif:var(--aos-font-mono);--radius:var(--aos-radius)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13.5px/1.5 var(--sans);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
.container{width:min(calc(100% - 2rem),80rem);margin:0 auto}
main{padding:1.2rem 0 6.5rem}
.kicker{margin:0 0 .8rem;color:var(--green);font:600 .7rem var(--aos-font-mono);letter-spacing:.14em;text-transform:uppercase}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;min-height:var(--aos-top-h);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.65rem;font:700 .8rem var(--aos-font-mono);letter-spacing:.14em;text-transform:uppercase}
.mark{display:grid;width:1.9rem;height:1.9rem;place-items:center;border:1px solid var(--green);border-radius:var(--radius);color:var(--green);font-size:.65rem;letter-spacing:0}
.nav{color:var(--muted);font:400 .78rem var(--aos-font-mono);display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.button{display:inline-flex;min-height:2.1rem;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--aos-radius-s);padding:.3rem .85rem;background:var(--paper-2);color:var(--ink);font:400 .76rem var(--aos-font-mono);cursor:pointer;text-decoration:none}
.button:not(.secondary){background:var(--green);border-color:var(--green);color:var(--aos-accent-ink);font-weight:700}
.button.secondary{background:var(--paper-2);color:var(--ink)}
.button[aria-pressed=true],.button.on{background:color-mix(in srgb,var(--green) 18%,var(--paper-2));border-color:var(--green);color:var(--ink)}
.button:hover{border-color:var(--green)}
.button:not(.secondary):hover{background:color-mix(in srgb,var(--green) 85%,#fff)}
.button:disabled{opacity:.5;cursor:not-allowed}
.state{color:var(--aos-ok);font:600 .68rem var(--aos-font-mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.state::before{display:inline-block;width:.4rem;height:.4rem;margin-right:.4rem;border-radius:50%;background:currentColor;content:""}
.cat{color:var(--muted);font:600 .66rem var(--aos-font-mono);letter-spacing:.12em;text-transform:uppercase}
.search{width:100%;min-height:2.4rem;border:1px solid var(--line);border-radius:var(--aos-radius-s);padding:.5rem .9rem;background:var(--paper-2);color:var(--ink)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--line);border-radius:var(--aos-chip-r);padding:.3rem .65rem;background:transparent;color:var(--muted);cursor:pointer;font:400 .72rem var(--aos-font-mono)}
.chip:hover{border-color:var(--green);color:var(--ink)}
.chip[aria-pressed=true]{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--paper-2));color:var(--ink)}
.chip b{font-weight:700;margin-left:.3rem;opacity:.75}
.strip{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);margin:1rem 0}
.strip>div{flex:1 1 7rem;padding:.8rem 1rem;border-right:1px solid var(--line)}.strip>div:last-child{border:0}
.strip strong{display:block;font:600 1.6rem var(--aos-font-mono);line-height:1}
.strip small{color:var(--muted);font:600 .64rem var(--aos-font-mono);letter-spacing:.12em;text-transform:uppercase}
.ledger{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:1.5rem;padding-top:1.2rem}
.rail{position:sticky;top:calc(var(--aos-top-h) + .5rem);align-self:start;display:grid;gap:1rem}
.rail .chips{flex-direction:column}.rail .chip{text-align:left;display:flex;justify-content:space-between;border-left:3px solid transparent}
.rail .chip[aria-pressed=true]{border-left-color:var(--green)}
.rail h1{font:700 1.5rem var(--aos-font-mono);letter-spacing:-.02em;line-height:1.1;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.7rem}
.card{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--white);overflow:hidden}
.card-body{display:flex;flex-direction:column;gap:.5rem;flex:1;min-width:0;padding:.9rem 1rem .7rem;border:0;background:transparent;text-align:left;cursor:pointer}
button.card-body:hover{background:var(--paper-2)}
.card-name{font:700 1rem var(--aos-font-mono);line-height:1.25;overflow-wrap:anywhere}
.card-meta{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.card-desc{color:var(--muted);font-size:.82rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-note{color:var(--muted);font-size:.7rem}
.card-foot{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;justify-content:space-between;padding:.55rem 1rem;border-top:1px solid var(--line)}
.tag{border:1px solid var(--line);border-radius:var(--aos-chip-r);padding:.05rem .5rem;color:var(--muted);font:600 .62rem var(--aos-font-mono);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.empty{padding:3rem 1rem;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
.src{font:600 .68rem var(--aos-font-mono)}
@media(max-width:1099px){.ledger{grid-template-columns:1fr}.rail{position:static}}
.scope{display:flex;gap:.4rem;align-items:center}
.badge{display:inline-block;padding:.05rem .5rem;border:1px solid var(--line);border-radius:var(--aos-chip-r);background:var(--paper-2);color:var(--muted);font:600 .62rem var(--aos-font-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
dialog{width:min(40rem,calc(100% - 2rem));border:1px solid var(--green);border-radius:var(--radius);background:var(--white);color:var(--ink);padding:1.2rem}
dialog::backdrop{background:var(--aos-overlay)}
dialog h2{font:700 1.2rem var(--aos-font-mono);margin:0 0 .6rem}
dialog pre{margin:.6rem 0;padding:.7rem;border-radius:var(--aos-radius-s);background:var(--aos-code-bg);border:1px solid var(--line);color:var(--ink);font-size:.72rem;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
dialog .acts{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
.err{color:var(--bad);font-size:.78rem}
.badge.warn{border-color:var(--aos-status-needs-you-border);background:var(--aos-status-needs-you-bg);color:var(--aos-status-needs-you-fg)}
.warnbox{padding:.6rem .8rem;border:1px solid var(--bad);border-left-width:3px;border-radius:var(--aos-radius-s);color:var(--bad);font-size:.8rem;font-weight:600}
.cmdnote{font-size:.7rem;color:var(--muted);margin:.3rem 0 0}
#inspector{position:fixed;top:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;gap:.9rem;width:min(36rem,100%);padding:1.2rem 1.4rem;overflow-y:auto;background:var(--white);border-left:1px solid var(--green);transform:translateX(100%);transition:transform .25s ease}
#inspector.open{transform:none}
.insp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
#ins-name{font:700 1.5rem var(--aos-font-mono);line-height:1.1;margin:0;overflow-wrap:anywhere}
.insp-meta{display:flex;flex-wrap:wrap;gap:.35rem}
.insp-body{display:grid;gap:.6rem}
.insp-body p{margin:0;color:var(--muted);font-size:.85rem}
.insp-body .kicker{margin:0;color:var(--green)}
.insp-body .err{color:var(--bad);font-size:.8rem}
.insp-body pre,#ins-dry pre{margin:0;padding:.7rem;border-radius:var(--aos-radius-s);background:var(--aos-code-bg);border:1px solid var(--line);color:var(--ink);font-size:.72rem;max-height:22rem;overflow:auto;white-space:pre-wrap;word-break:break-word}
.insp-dry{display:grid;gap:.5rem;border-top:1px solid var(--line);padding-top:1rem}
#ins-dry{display:grid;gap:.5rem}
/* Lanes layer (docs/ui-lanes.md): tone depth instead of borders, pills, KPI strip, lane edge only on agent cards. */
.kicker{color:var(--aos-faint);font:500 .78rem var(--sans);letter-spacing:0;text-transform:none}
.rail{padding:12px 10px;border-radius:var(--aos-radius-l);background:var(--aos-surface)}
.rail h1{font:600 1.25rem var(--sans);letter-spacing:-.02em}
.rail .chip{border:0;border-left:0;border-radius:7px;position:relative;padding:.4rem .6rem .4rem .9rem;transition:background var(--aos-motion-fast) var(--aos-ease-out),color var(--aos-motion-fast) var(--aos-ease-out)}
.rail .chip:hover{background:var(--aos-surface-3)}
.rail .chip[aria-pressed=true]{background:var(--aos-surface-2);box-shadow:var(--aos-shadow-card)}
.rail .chip[aria-pressed=true]::before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--green)}
.chip{border-radius:var(--aos-radius-pill);border-color:var(--aos-border-strong)}
.chip b{font-variant-numeric:tabular-nums;color:var(--aos-faint)}
.search{border-radius:7px;background:var(--aos-bg);border-color:var(--aos-border-strong)}
.card-body:focus-visible{outline:2px solid var(--aos-accent);outline-offset:-2px}
.button{border-radius:7px;transition:background var(--aos-motion-fast) var(--aos-ease-out),border-color var(--aos-motion-fast) var(--aos-ease-out),transform var(--aos-motion-instant) var(--aos-ease-out)}
.button:active{transform:scale(.97)}
.button.secondary{background:var(--aos-surface-3);border-color:var(--aos-line)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:1px;border:0;border-radius:var(--aos-radius-l);overflow:hidden;background:var(--aos-line)}
.strip>div{border:0;background:var(--aos-surface);padding:14px 16px}
.strip strong{font:500 26px/1.15 var(--aos-font-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.strip small{font:400 .75rem var(--sans);letter-spacing:0;text-transform:none;color:var(--aos-faint)}
.grid{gap:14px}
.card{position:relative;border:0;border-radius:var(--aos-radius-l);background:var(--aos-surface-2);box-shadow:var(--aos-shadow-card);transition:box-shadow var(--aos-motion-settle) var(--aos-ease-out)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--lane,transparent);opacity:.55;pointer-events:none}
.card:focus-within{box-shadow:var(--aos-shadow-focus)}.card:focus-within::before{opacity:1}
button.card-body:hover{background:var(--aos-surface-3)}
.card-name{font:600 14px/1.25 var(--sans);letter-spacing:-.01em}
.card-foot{border-color:var(--aos-line)}
.tag,.badge{border-radius:var(--aos-radius-pill);font:500 .68rem var(--aos-font-mono);letter-spacing:0;text-transform:none;border-color:var(--aos-line)}
.tag{background:var(--aos-surface-3)}
.state{font:500 .72rem var(--aos-font-mono);letter-spacing:0;text-transform:none}
.empty{border-color:var(--aos-border);border-radius:var(--aos-radius-l)}
dialog{border:0;border-radius:var(--aos-radius-l);background:var(--aos-surface-2);box-shadow:var(--aos-shadow-focus)}
dialog h2,#ins-name{font-family:var(--sans);font-weight:600;letter-spacing:-.02em}
dialog pre,.insp-body pre,#ins-dry pre{border:0;border-radius:8px;box-shadow:inset 0 1px 2px #0000004d}
.warnbox{border:0;border-radius:8px;background:color-mix(in srgb,var(--bad) 8%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 35%,transparent)}
#inspector{background:var(--aos-surface);border-left:1px solid var(--aos-line);box-shadow:-28px 0 70px -28px #000;transition:transform var(--aos-motion-settle) var(--aos-ease-camera)}
.insp-dry{border-color:var(--aos-line)}
#stack-bar{position:fixed;bottom:0;left:0;right:0;z-index:25;background:var(--aos-surface);border-top:1px solid var(--aos-line);box-shadow:0 -8px 24px rgba(0,0,0,.2);padding:.6rem 1rem;display:none;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem}
#stack-bar.visible{display:flex}
.stack-info{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.stack-count{font:600 .85rem var(--sans);color:var(--ink);white-space:nowrap}
.stack-cmd-box{display:flex;align-items:center;gap:.4rem;flex:1 1 14rem;min-width:0}
.stack-cmd{flex:1;min-width:0;font:500 .74rem var(--aos-font-mono);background:var(--aos-surface-2);color:var(--ink);padding:.35rem .6rem;border-radius:6px;border:1px solid var(--line);overflow-x:auto;white-space:nowrap;user-select:all}
.stack-acts{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.stack-check{display:inline-flex;align-items:center;gap:.35rem;font:500 .72rem var(--aos-font-mono);color:var(--muted);cursor:pointer;user-select:none}
.stack-check:hover{color:var(--ink)}
.stack-check input[type=checkbox]{width:1rem;height:1rem;accent-color:var(--green);cursor:pointer;margin:0}
.stack-check input[type=checkbox]:focus-visible{outline:2px solid var(--aos-accent);outline-offset:2px}
.card-acts{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
@media(max-width:560px){#stack-bar{padding:.5rem .75rem;gap:.5rem}.stack-cmd-box{width:100%;order:3}.stack-info{flex:1}}
</style></head><body>
<div class="container"><main id="app"></main></div>
<aside id="inspector" role="dialog" aria-modal="true" aria-label="Item inspector" inert>
  <div class="insp-head"><div><p class="kicker" id="ins-kind" style="margin:0 0 .4rem"></p><h2 id="ins-name" tabindex="-1"></h2></div><button class="button secondary" id="ins-close" data-a="inspect-close">Close</button></div>
  <div class="insp-meta" id="ins-meta"></div>
  <div class="insp-body" id="ins-body"></div>
  <div class="insp-dry"><div id="ins-dry-row"><button class="button" id="ins-dry-btn" data-a="dry-run">Dry run</button> <span class="cmdnote">Shows what would be written. Installs nothing.</span></div><div id="ins-dry" aria-live="polite"></div></div>
</aside>
<div id="stack-bar" role="region" aria-label="Stack builder" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<script>
const TOKEN='__TOKEN__';
const S={tab:'skill',sub:'discover',scope:'global',q:'',cat:'',src:'',data:null,busy:null,detail:{},inspect:null,seq:0,dseq:0,stack:new Map()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=i=>i.kind+':'+i.name;
const find=k=>S.data.items.find(i=>key(i)===k);
const base=()=>S.data.items.filter(i=>i.kind===S.tab);
const visible=()=>{const q=S.q.toLowerCase();return base().filter(i=>(S.sub==='installed')===i.installed&&(!S.cat||i.category===S.cat)&&(!S.src||i.source===S.src)&&(!q||(i.name+' '+i.description+' '+i.category).toLowerCase().includes(q)))};
const uniq=f=>[...new Set(S.data.items.map(f))].sort();
const count=(f,v)=>base().filter(i=>f(i)===v).length;
const chip=(a,v,label,n)=>`<button class="chip" aria-pressed="${S[a]===v}" data-a="${a}" data-v="${esc(v)}">${esc(label)}<b>${n}</b></button>`;
const el=(t,text,cls)=>{const n=document.createElement(t);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n};
function strip(){const all=S.data.items;return `<div class="strip"><div><strong>${all.length}</strong><small>total</small></div>${uniq(i=>i.source).map(s=>`<div><strong>${all.filter(i=>i.source===s).length}</strong><small>${esc(s)}</small></div>`).join('')}</div>`}
function tabs(){const n=base(),ic=n.filter(i=>i.installed).length,k=x=>S.data.items.filter(i=>i.kind===x).length,pk=S.data?.packs?.length||0;return `<div class="tabs">${chip('tab','skill','Skills',k('skill'))}${chip('tab','agent','Agents',k('agent'))}${chip('tab','pack','Packs',pk)}${chip('tab','playbook','Playbooks',S.data.playbooks.length)}${['playbook','pack'].includes(S.tab)?'':`<span style="width:1rem"></span>${chip('sub','installed','Installed',ic)}${chip('sub','discover','Discover',n.length-ic)}`}</div>`}
const scopeToggle=()=>`<div class="scope"><span class="kicker" style="margin:0">Scope</span>${chip('scope','global','Global','')}${chip('scope','project','Project','')}</div>`;
function act(i){
  if(i.core) return '<span class="state">AOS Core</span>';
  if(i.installed) return `<span class="state">Installed</span>`;
  if(S.busy===key(i)) return '<button class="button" disabled>Working...</button>';
  return `<button class="button secondary" data-a="add" data-v="${esc(key(i))}">+ Add</button>`;
}
// Lane = agent identity: FNV-1a of the agent name mod 6, the same hash AgentTrail uses.
const laneOf=n=>{const k=n.toLowerCase();let h=0x811c9dc5;for(let i=0;i<k.length;i++)h=Math.imul(h^k.charCodeAt(i),0x01000193)>>>0;return h%6};
function card(i){
  const k=key(i);
  const isChecked=S.stack.has(k);
  const badges=(i.fileCount>1?`<span class="badge">${i.fileCount} files</span>`:'')
    +(i.hasHooks?'<span class="badge">hooks</span>':'')
    +(i.execBridge?'<span class="badge warn">exec bridge</span>':'')
    +((i.requires||[]).length?`<span class="badge">+${i.requires.length} required</span>`:'')
    +(i.license?`<span class="badge">${esc(i.license)}</span>`:'')
    +(i.thirdParty?'<span class="badge">third-party</span>':'');
  const dry=i.core?'':`<button class="button secondary" data-a="dry" data-v="${esc(k)}">Dry run</button>`;
  const check=i.core?'':`<label class="stack-check"><input type="checkbox" class="check-box" data-a="check" data-kind="${esc(i.kind)}" data-name="${esc(i.name)}" ${isChecked?'checked':''} aria-label="Select ${esc(i.name)} for stack"> <span>Stack</span></label>`;
  return `<article class="card"${i.kind==='agent'?` data-lane="${laneOf(i.name)}"`:''}><button class="card-body" data-a="open" data-v="${esc(k)}"><span class="card-name">${esc(i.name)}</span><span class="card-meta"><span class="tag">${esc(i.kind)}</span><span class="tag">${esc(i.category)}</span><span class="src">${esc(i.source)}</span></span><span class="card-desc">${esc(i.description)}</span><span class="card-meta">${badges}</span></button><div class="card-foot">${check}<div class="card-acts">${act(i)}${dry}</div></div></article>`;
}
function packCard(p){
  const k='pack:'+p.name;
  const isChecked=S.stack.has(k);
  const dry=`<button class="button secondary" data-a="dry-pack" data-v="${esc(p.name)}">Dry run</button>`;
  return `<article class="card"><div class="card-body"><span class="card-name">${esc(p.name)}</span><span class="card-meta"><span class="tag">pack</span><span class="tag">${p.skills} skills</span>${p.external?'<span class="tag">external</span>':''}</span><span class="card-desc">${esc(p.description)}</span></div><div class="card-foot"><label class="stack-check"><input type="checkbox" class="check-box" data-a="check" data-kind="pack" data-name="${esc(p.name)}" ${isChecked?'checked':''} aria-label="Select pack ${esc(p.name)} for stack"> <span>Stack</span></label><div class="card-acts">${dry}</div></div></article>`;
}
const reqLabel=r=>[...r.skills,...r.agents.map(a=>'agent:'+a),...r.mcps.map(m=>'mcp:'+m),...r.store.map(x=>'store:'+x)].join(', ');
function pbCard(p){return `<article class="card"><div class="card-body"><span class="card-name">${esc(p.name)}</span><span class="card-meta"><span class="tag">${esc(p.difficulty)}</span><span class="src">${esc(p.est_time)}</span></span><span class="card-desc">${esc(p.description)}</span><span class="card-note">Requires: ${esc(reqLabel(p.requires)||'nothing')}</span></div><div class="card-foot"><span class="state">AOS Core</span></div></article>`}
function renderPlaybooks(){
  const a=document.activeElement,fq=a&&a.id==='q',pos=fq?a.selectionStart:0,q=S.q.toLowerCase(),l=S.data.playbooks.filter(p=>!q||(p.name+' '+p.description+' '+p.difficulty).toLowerCase().includes(q));
  document.getElementById('app').innerHTML=`<div class="ledger"><aside class="rail"><h1>AOS<br>Store</h1><input class="search" id="q" type="search" placeholder="Search playbooks" value="${esc(S.q)}" aria-label="Search">${tabs()}<p class="cmdnote">Playbooks ship with AOS Core. Start one with /bdb-aos:playbooks.</p></aside><section><p class="kicker">${l.length} of ${S.data.playbooks.length} playbooks</p>${l.length?`<div class="grid">${l.map(pbCard).join('')}</div>`:'<div class="empty">No matches.</div>'}</section></div>`;
  if(fq){const e=document.getElementById('q');e.focus();e.setSelectionRange(pos,pos)}
  updateStackBar();
}
function renderPacks(){
  const a=document.activeElement,fq=a&&a.id==='q',pos=fq?a.selectionStart:0,q=S.q.toLowerCase(),all=S.data.packs||[],l=all.filter(p=>!q||(p.name+' '+p.description).toLowerCase().includes(q));
  document.getElementById('app').innerHTML=`<div class="ledger"><aside class="rail"><h1>AOS<br>Store</h1><p class="kicker" style="margin:0">Active scope: ${S.scope==='global'?'Global (harness roots in ~)':'Project ('+esc(S.data.cwd)+')'}</p>${scopeToggle()}<input class="search" id="q" type="search" placeholder="Search packs" value="${esc(S.q)}" aria-label="Search">${tabs()}<p class="cmdnote">Packs group curated skills. Stack them or install with aos store install --pack &lt;name&gt;.</p></aside><section><p class="kicker">${l.length} of ${all.length} packs</p>${strip()}${l.length?`<div class="grid">${l.map(packCard).join('')}</div>`:'<div class="empty">No matches.</div>'}</section></div>`;
  if(fq){const e=document.getElementById('q');e.focus();e.setSelectionRange(pos,pos)}
  updateStackBar();
}
function buildStackCmd(){
  const skills=[],packs=[];
  for(const it of S.stack.values()){
    if(it.kind==='pack') packs.push(it.name);
    else skills.push(it.name);
  }
  const scopeFlag=S.scope==='project'?' --project':'';
  const cmds=[];
  if(skills.length) cmds.push(`aos store install ${skills.join(' ')}${scopeFlag}`);
  for(const p of packs) cmds.push(`aos store install --pack ${p}${scopeFlag}`);
  return cmds.join(' && ');
}
function updateStackBar(){
  const bar=document.getElementById('stack-bar');
  if(!bar)return;
  const count=S.stack.size;
  if(count===0){
    bar.classList.remove('visible');
    bar.replaceChildren();
    return;
  }
  const cmd=buildStackCmd();
  bar.innerHTML=`<div class="stack-info"><span class="stack-count"><strong>${count}</strong> ${count===1?'item':'items'} in stack</span></div><div class="stack-cmd-box"><code class="stack-cmd" title="Combined CLI command">${esc(cmd)}</code><button class="button secondary" data-a="copy-stack" aria-label="Copy CLI command">Copy</button></div><div class="stack-acts"><button class="button" data-a="dry-stack">Dry run</button><button class="button secondary" data-a="clear-stack" aria-label="Clear stack selection">Clear</button></div>`;
  bar.classList.add('visible');
}
function render(){
  if(S.tab==='playbook')return renderPlaybooks();
  if(S.tab==='pack')return renderPacks();
  const a=document.activeElement,fq=a&&a.id==='q',pos=fq?a.selectionStart:0,l=visible();
  document.getElementById('app').innerHTML=`<div class="ledger"><aside class="rail"><h1>AOS<br>Store</h1><p class="kicker" style="margin:0">Active scope: ${S.scope==='global'?'Global (harness roots in ~)':'Project ('+esc(S.data.cwd)+')'}</p>${scopeToggle()}<input class="search" id="q" type="search" placeholder="Search ${S.tab}s" value="${esc(S.q)}" aria-label="Search">${tabs()}<div><p class="kicker">Category</p><div class="chips">${chip('cat','','all',base().length)}${uniq(i=>i.category).map(c=>chip('cat',c,c,count(i=>i.category,c))).join('')}</div></div><div><p class="kicker">Source</p><div class="chips">${chip('src','','all',base().length)}${uniq(i=>i.source).map(s=>chip('src',s,s,count(i=>i.source,s))).join('')}</div></div></aside><section><p class="kicker">${l.length} of ${base().length} ${S.tab}s</p>${strip()}${l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty">${S.sub==='installed'?'Nothing installed yet.':'No matches.'}</div>`}</section></div>`;
  if(fq){const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)}
  arrive();
  updateStackBar();
}
// Lanes M1: the catalog cards arrive once, when the catalog data first lands; filtering re-renders stay still.
function arrive(){if(S.arrived)return;const cards=document.querySelectorAll('#app .card');if(!cards.length)return;S.arrived=true;cards.forEach((c,i)=>{c.style.setProperty('--i',String(Math.min(i,8)));c.classList.add('aos-enter')})}
async function load(){
  const r=await fetch('api/catalog?scope='+S.scope);
  if(!r.ok) throw new Error('catalog '+r.status);
  S.data=await r.json();
}
async function post(path,item){
  const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json','x-store-token':TOKEN},body:JSON.stringify({name:item.name,kind:item.kind,scope:S.scope})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||r.status);
  return d;
}
const dlg=document.getElementById('dlg');
const scopeName=()=>S.scope==='global'?'Global':'Project';
async function preview(k){
  const i=find(k);S.busy=k;render();
  try{
    const d=await post('api/preview',i);
    const ok=d.ok&&d.targets.length;
    const m=d.meta||{};
    const fc=m.fileCount||i.fileCount,tc=fc>0?Math.round(d.targets.length/fc):1;const size=m.totalSize>0?` = ${fc} file(s) × ${tc} target(s), ${(m.totalSize/1024).toFixed(1)} KB each`:(i.totalSize!=null?` = ${i.fileCount} file(s) × ${tc} target(s), ${(i.totalSize/1024).toFixed(1)} KB each`:'');
    const warn=(i.hasHooks?'<p class="err">Includes hooks — copied only, NOT registered in your harness settings; the skill may need manual wiring.</p>':'')
      +(m.execBridge?`<p class="warnbox">Warning: contains a script that executes code received over a local socket or file channel without authentication — install only if you use this bridge.<br><span style="font-weight:400">${esc((m.execBridgeFiles||[]).map(f=>f.skill+'/'+f.path).join(', '))}</span></p>`:(m.hasScripts?`<p class="cmdnote">Contains ${m.scriptCount} script file(s) that run on your machine when the skill is used. Review them before use.</p>`:''))
      +(m.software&&m.software.length?`<p class="cmdnote">Needs third-party software that is not included: ${esc(m.software.join(', '))}.</p>`:'')
      +(m.requires&&m.requires.length?`<p class="cmdnote">Also installs required skill(s): ${esc(m.requires.join(', '))}.</p>`:'');
    const srcLabel=m.source||i.source,pin=(m.pinned_commit||S.data.pinned_commit).slice(0,10);
    const lic=m.license?` — ${esc(m.license)}${m.copyright?', '+esc(m.copyright):''}`:'';
    const nfiles=m.fileCount||i.fileCount;
    dlg.innerHTML=`<h2>Add ${esc(i.name)}</h2><p class="kicker">${scopeName()} scope — will write ${d.targets.length} file(s)${size}</p><p class="cmdnote">Source: ${esc(srcLabel)}${lic}${m.thirdParty?' (third-party content)':''}</p>${warn}<pre style="max-height:16rem;overflow:auto">${esc(ok?d.targets.join('\n'):(d.stdout+d.stderr).trim())}</pre><p class="cmdnote">Downloads ${nfiles>1?nfiles+' files':'the file'} from ${esc(srcLabel)} at ${esc(pin)}, each verified by SHA-256.</p><div id="res"></div><div class="acts"><button class="button secondary" data-a="close">Cancel</button>${ok?`<button class="button" data-a="confirm" data-v="${esc(k)}">Install to ${scopeName()}</button>`:''}</div>`;
    dlg.showModal();
  }catch(e){alert('Preview failed: '+e.message)}
  finally{S.busy=null;render()}
}
async function confirmInstall(k,btn){
  const i=find(k);btn.disabled=true;btn.textContent='Installing...';
  const res=dlg.querySelector('#res');
  try{
    const d=await post('api/install',i);
    if(!d.ok||!d.installed) throw new Error((d.stderr||d.stdout||'install failed').trim());
    dlg.close();await load();
  }catch(e){res.innerHTML=`<p class="err">${esc(e.message)}</p>`;btn.disabled=false;btn.textContent='Retry'}
  render();
}
async function ensureDetail(k){
  const i=find(k);
  if(i.core) return i.description;
  if(S.detail[k]===undefined){
    try{const r=await fetch(`api/detail?name=${encodeURIComponent(i.name)}&kind=${encodeURIComponent(i.kind)}`);const d=await r.json();if(!r.ok)throw new Error(d.error);S.detail[k]=d.description||i.description}
    catch(e){S.detail[k]=i.description+' (full description unavailable: '+e.message+')'}
  }
  return S.detail[k];
}
async function loadDoc(i){
  const r=await fetch(`api/skill?name=${encodeURIComponent(i.name)}&kind=${encodeURIComponent(i.kind)}`);
  if(r.status===404) return null;
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||r.status);
  return d;
}
const insp=document.getElementById('inspector'),app=document.getElementById('app');
async function fillBody(k,seq){
  const i=find(k),kids=[];
  let doc=null;
  try{doc=await loadDoc(i)}catch(e){kids.push(el('p','SKILL.md unavailable: '+e.message,'err'))}
  if(seq!==S.seq)return;
  if(doc){
    kids.push(el('p',i.description),el('p','Path: '+doc.path,'cmdnote'));
    if(doc.truncated)kids.push(el('p','Truncated at 200 KB.','err'));
    kids.push(el('p','Frontmatter','kicker'),el('pre',doc.frontmatter),el('p','SKILL.md','kicker'),el('pre',doc.body));
  }else{
    const text=await ensureDetail(k);
    if(seq!==S.seq)return;
    kids.push(el('p',text),el('p','Full SKILL.md is shown after install.','cmdnote'));
  }
  document.getElementById('ins-body').replaceChildren(...kids);
}
function openInspector(k){
  const i=find(k),seq=++S.seq;
  S.inspect=k;
  document.getElementById('ins-kind').textContent=i.kind;
  document.getElementById('ins-name').textContent=i.name;
  document.getElementById('ins-meta').replaceChildren(...[i.kind,i.category,i.source,i.license,i.installed?'installed':'',i.execBridge?'exec bridge':'',i.hasHooks?'hooks':'',i.thirdParty?'third-party':''].filter(Boolean).map(t=>el('span',t,'tag')));
  document.getElementById('ins-body').replaceChildren(el('p','Loading...'));
  document.getElementById('ins-dry').replaceChildren();
  document.getElementById('ins-dry-btn').dataset.v=k;
  document.getElementById('ins-dry-row').hidden=!!i.core;
  insp.inert=false;insp.classList.add('open');app.inert=true;
  document.getElementById('ins-name').focus();
  fillBody(k,seq);
}
function closeInspector(){
  const k=S.inspect;if(!k)return;
  S.inspect=null;S.seq++;S.dseq++;
  insp.inert=true;app.inert=false;insp.classList.remove('open');
  render();
  [...document.querySelectorAll('button[data-a="open"]')].find(b=>b.dataset.v===k)?.focus();
}
async function dryRun(k){
  const i=find(k),seq=++S.dseq,out=document.getElementById('ins-dry');
  out.replaceChildren(el('p','Running dry run...','cmdnote'));
  try{
    const d=await post('api/preview',i);
    if(seq!==S.dseq)return;
    const m=d.meta||{},ok=d.ok&&d.targets.length;
    const nodes=[el('p',`Scope: ${scopeName()}. Dry run only: nothing was written.`,'cmdnote')];
    nodes.push(ok?el('p',`Would write ${d.targets.length} file(s):`):el('p','Dry run reported a problem:','err'));
    nodes.push(el('pre',ok?d.targets.join('\n'):(d.stdout+d.stderr).trim()));
    nodes.push(el('p',`Source: ${m.source||i.source}${m.license?' — '+m.license:''}${m.copyright?', '+m.copyright:''}${m.pinned_commit?' @ '+m.pinned_commit.slice(0,10):''}`,'cmdnote'));
    if(i.hasHooks)nodes.push(el('p','Includes hooks: copied only, NOT registered in your harness settings.','err'));
    if(m.execBridge)nodes.push(el('p','Warning: contains a script that executes code received over a local socket or file channel without authentication.','warnbox'));
    else if(m.hasScripts)nodes.push(el('p',`Contains ${m.scriptCount} script file(s) that run on your machine when the skill is used.`,'cmdnote'));
    if(m.software&&m.software.length)nodes.push(el('p',`Needs third-party software that is not included: ${m.software.join(', ')}.`,'cmdnote'));
    if(m.requires&&m.requires.length)nodes.push(el('p',`Would also install required skill(s): ${m.requires.join(', ')}.`,'cmdnote'));
    out.replaceChildren(...nodes);
  }catch(e){
    if(seq===S.dseq)out.replaceChildren(el('p','Dry run failed: '+e.message,'err'));
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.inspect){e.preventDefault();closeInspector()}});
document.addEventListener('change',e=>{
  if(e.target.matches('input[data-a="check"]')){
    const {kind,name}=e.target.dataset;
    const k=kind+':'+name;
    if(e.target.checked) S.stack.set(k,{kind,name});
    else S.stack.delete(k);
    updateStackBar();
  }
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='close')return dlg.close();
  if(a==='confirm')return confirmInstall(v,b);
  if(a==='add')return preview(v);
  if(a==='open')return openInspector(v);
  if(a==='inspect-close')return closeInspector();
  if(a==='dry'){openInspector(v);return dryRun(v)}
  if(a==='dry-run')return dryRun(b.dataset.v);
  if(a==='copy-stack'){
    const cmd=buildStackCmd();
    try{await navigator.clipboard.writeText(cmd)}catch{const ta=document.createElement('textarea');ta.value=cmd;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
    b.textContent='Copied!';
    setTimeout(()=>{if(b)b.textContent='Copy'},2000);
    return;
  }
  if(a==='clear-stack'){
    S.stack.clear();
    render();
    return;
  }
  if(a==='dry-stack'){
    b.disabled=true;b.textContent='Running...';
    try{
      const items=Array.from(S.stack.values());
      const res=await fetch('api/preview-batch',{method:'POST',headers:{'content-type':'application/json','x-store-token':TOKEN},body:JSON.stringify({items,scope:S.scope})});
      const d=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(d.error||('dry-run failed ('+res.status+')'));
      const cmd=buildStackCmd();
      const tgts=d.targets||[];
      dlg.innerHTML=`<h2>Stack Dry Run</h2><p class="kicker">${scopeName()} scope — ${items.length} item(s) in stack — dry run only: nothing was written</p><p class="cmdnote">${tgts.length} target file(s) would be created or updated:</p><pre style="max-height:16rem;overflow:auto">${esc(tgts.length?tgts.join('\n'):'(no file writes needed)')}</pre><p class="cmdnote">To install this stack, run in your terminal:</p><pre style="max-height:6rem;overflow:auto">${esc(cmd)}</pre><div class="acts"><button class="button secondary" data-a="close">Close</button><button class="button" data-a="copy-cmd" data-cmd="${esc(cmd)}">Copy command</button></div>`;
      dlg.showModal();
    }catch(err){alert('Stack dry run failed: '+err.message)}
    finally{b.disabled=false;b.textContent='Dry run'}
    return;
  }
  if(a==='copy-cmd'){
    const cmd=b.dataset.cmd||'';
    try{await navigator.clipboard.writeText(cmd)}catch{const ta=document.createElement('textarea');ta.value=cmd;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
    b.textContent='Copied!';
    setTimeout(()=>{if(b)b.textContent='Copy command'},2000);
    return;
  }
  if(a==='dry-pack'){
    b.disabled=true;b.textContent='Checking...';
    try{
      const d=await post('api/preview',{name:v,kind:'pack'});
      const tgts=d.targets||[];
      dlg.innerHTML=`<h2>Pack ${esc(v)}</h2><p class="kicker">${scopeName()} scope — dry run only: nothing was written</p><p class="cmdnote">${tgts.length} target file(s) would be created or updated:</p><pre style="max-height:16rem;overflow:auto">${esc(tgts.length?tgts.join('\n'):'(no files to write)')}</pre><div class="acts"><button class="button secondary" data-a="close">Close</button></div>`;
      dlg.showModal();
    }catch(err){alert('Dry run failed: '+err.message)}
    finally{b.disabled=false;b.textContent='Dry run'}
    return;
  }
  if(a==='tab'){S.tab=v;S.cat='';S.src=''}
  else if(a==='sub'||a==='cat'||a==='src')S[a]=v;
  else if(a==='scope'){S.scope=v;await load()}
  render();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;render()}});
load().then(render).catch(e=>{document.getElementById('app').textContent='Failed to load catalog: '+e.message});
</script></body></html>
