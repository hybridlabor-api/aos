on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The following steps run ONLY if release-please actually created a release
      - name: Checkout Repository
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # prepack (scripts/build-shipped-hashes.mjs) needs every v* tag; a shallow clone has none.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to NPM
        if: ${{ steps.release.outputs.release_created }}
        # A prerelease (5.0.0-beta.1) goes to its own dist-tag (beta, rc), never to latest.
        run: |
          v=$(node -p "require('./package.json').version")
          case "$v" in
            *-*) npm publish --access public --tag "$(echo "$v" | sed -E 's/^[^-]+-([A-Za-z]+).*/\1/')" ;;
            *) npm publish --access public ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
