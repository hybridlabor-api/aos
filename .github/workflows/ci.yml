name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Syntax & Validation
    if: "${{ !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'

      - name: Check JS Syntax
        run: node --check installer.js

      - name: Validate skill contract
        run: |
          node scripts/validate-skills.mjs --selftest
          node scripts/validate-skills.mjs
          node scripts/validate-profile.mjs --selftest
          node scripts/validate-profile.mjs

      - name: Validate JSON files
        run: |
          # Use jq to validate all JSON files (exclude json with comments like tsconfig/vscode/tauri)
          find . -name "*.json" -not -path "*/node_modules/*" -not -path "*/vendor/*" -not -name "tsconfig*.json" -not -path "*/.vscode/*" -not -name "tauri.conf.json" -not -name "launchSettings.json" -not -name "paint_elements.json" -print0 | xargs -0 -I {} jq empty {}

  full-test:
    name: Full test suite (Linux, Node 24)
    if: "${{ !startsWith(github.head_ref, 'release-please--') && !startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    env:
      AOS_TEST_SANDBOX: container
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm test
        run: npm test

  windows:
    name: Windows hooks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      - name: Check JS Syntax
        run: node --check installer.js

      - name: Windows hook tests (cmd /c, dry-run smoke)
        run: node --test tests/windows-hooks.test.js tests/antigravity-hooks.test.js

  fabric-smoke:
    name: Fabric smoke (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.x'

      # aos-fabric runs on every harness and OS. The fabric tests start whole runs with fake claude, codex, opencode and agy
      # binaries on PATH (they only write a report): no model, no login, no network.
      - name: Fabric tests
        run: node --test --test-timeout=120000 tests/fabric-schema.test.mjs tests/fabric-store.test.mjs tests/fabric-edges.test.mjs tests/fabric-verify.test.mjs tests/fabric-engine.test.mjs tests/fabric-cli.test.mjs tests/fabric-executors.test.mjs tests/fabric-drive.test.mjs tests/fabric-dispatch-client.test.mjs tests/fabric-smoke.test.mjs
