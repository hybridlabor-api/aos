name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Syntax & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Check JS Syntax
        run: node --check installer.js

      - name: Validate skill contract
        run: |
          node scripts/validate-skills.mjs --selftest
          node scripts/validate-skills.mjs

      - name: Validate JSON files
        run: |
          # Use jq to validate all JSON files (exclude json with comments like tsconfig/vscode/tauri)
          find . -name "*.json" -not -path "*/node_modules/*" -not -path "*/vendor/*" -not -name "tsconfig*.json" -not -path "*/.vscode/*" -not -name "tauri.conf.json" -not -name "launchSettings.json" -not -name "paint_elements.json" -print0 | xargs -0 -I {} jq empty {}
